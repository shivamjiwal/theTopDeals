<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Google Fonts Pre Connect -->
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <!-- Meta Tags -->
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Fonts Links (Roboto 400, 500 and 700 included) -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
        <!-- CSS Files Links -->
        <link rel="stylesheet" href="./styles.css">
        <!-- Title -->
        <title>Simple Page</title>
    </head>
    <body>
        <sidebar id="primary-sidebar">
            <img src="" alt="">
            <button
                type="button"
                id="collapse"
                aria-label="Collapse sidebar"
                aria-expanded="true"
                aria-controls="primary-sidebar"
            >
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="m15 18-6-6 6-6"></path>
                </svg>
            </button>
            <div>
                <div>
                    <img src="" alt="">
                    <p>Favourite</p>
                </div>
                <div class="custom-select-container">
                    <!-- 1. The Trigger Button -->
                    <button
                        type="button"
                        id="category-btn"
                        aria-haspopup="listbox"
                        aria-expanded="false"
                        aria-controls="category-list"
                    >
                        Select Category
                    </button>
                    <!-- 2. The Unordered List (Hidden by default) -->
                    <ul
                        id="category-list"
                        role="listbox"
                        aria-labelledby="category-btn"
                        hidden
                    >
                        <li role="option" tabindex="-1">Health</li>
                        <li role="option" tabindex="-1">Skin care</li>
                    </ul>
                </div>
                <div>
                    <img src="" alt="">
                    <p>Home</p>
                </div>
            </div>
        </sidebar>
        <nav>
            <a href="#" target="_self">Home</a>
            <div class="search-filter-container">
                <!-- Visually hidden but read by screen readers -->
                <label for="product" class="sr-only">Choose a product category</label>
                <select id="product" name="product">
                    <option value="">Select product</option>
                    <option value="health">Health</option>
                    <option value="skin-care">Skin care</option>
                </select>
                <!-- The image is now wrapped in a fully accessible button -->
                <button type="button" id="search-btn" aria-label="Search products by category">
                    <img src="search-icon.png" alt="" aria-hidden="true">
                </button>
            </div>
            <a href="#" target="_self" rel="noreferrer">Blog</a>
        </nav>
        <main id="product-results" aria-live="polite"></main>
        <sidebar id="side-content"></sidebar>
        <footer>
            <div class="footer">
                <div class="foot">
                    <img src="" alt="">
                    <p>About US</p>
                </div>
                <div class="foot">
                    <p>Blog</p>
                    <p>Support</p>
                </div>
            </div>
        </footer>
        <noscript>Your browser don't support JavaScript!</noscript>
        <script src="./app.js"></script>
    </body>
</html>
