<!DOCTYPE html>
<html lang="en">
    <head>
        <!-- Google Fonts Pre Connect -->
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <!-- Meta Tags -->
        <meta charset="UTF-8">
        <script src="https://kit.fontawesome.com/a784a0246f.js" crossorigin="anonymous"></script>
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Fonts Links (Roboto 400, 500 and 700 included) -->
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
        <!-- CSS Files Links -->
        <link rel="stylesheet" href="./styles.css">
        <!-- Title -->
        <title>Simple Page</title>
    </head>
    <body>
        <sidebar id="primary-sidebar" class="primary-sidebar">
            <div class="logo">
                <p class="para">The Top Deals</p>
                <button
                    type="button"
                    id="collapse"
                    class="btn"
                    aria-label="Collapse sidebar"
                    aria-expanded="true"
                    aria-controls="primary-sidebar"
                >
                    <svg
                        aria-label=""
                        viewBox="0 0 24 24"
                        aria-hidden="true"
                        focusable="false"
                    >
                        <path d="m15 18-6-6 6-6"></path>
                    </svg>
                </button>
            </div>
            <div class="content">
                <div class = "fav">
                    <p> <i class="fa-regular fa-heart heart"></i> Favourite</p>
                </div>
                <div class="custom-select-container">
                    <!-- 1. The Trigger Button -->
                    <button
                        type="button"
                        id="category-btn"
                        class = "category-btn"
                        aria-haspopup="listbox"
                        aria-expanded="false"
                        aria-controls="category-list"
                    >
                       <i class="fa-solid fa-table-list category"></i>   Select Category 
                    </button>
                    <!-- 2. The Unordered List (Hidden by default) -->
                    <ul
                        id="category-list"
                        role="listbox"
                        aria-labelledby="category-btn"
                        hidden
                    >
                        <li role="option" tabindex="-1">Health</li>
                        <li role="option" tabindex="-1">Skin care</li>
                    </ul>
                </div>
                <div class = "fav">
                    <p> <i class="fa-solid fa-house home"></i> Home</p>
                </div>
                <div class="theme"> 
                    <button class = "switcher"><i class="fa-solid fa-toggle-on swt"></i>  Theme Switcher</button>
                </div>
            </div>
        </sidebar>
        <nav>
            <div class = "nav-content">
                <a href="#" target="_self">Home</a>
                <div class="search-filter-container">
                    <!-- Visually hidden but read by screen readers -->
                    <label for="product" class="sr-only">Choose a product category</label>
                    <select class = "product" id="product" name="product">
                        <option value="">Select product</option>
                        <option value="health">Health</option>
                        <option value="skin-care">Skin care</option>
                    </select>
                    <!-- The image is now wrapped in a fully accessible button -->
                    <button type="button" id="search-btn" aria-label="Search products by category">
                        <i class="fa-solid fa-magnifying-glass search"></i>
                    </button>
                </div>
                <a class = "blog" href="#" target="_self" rel="noreferrer">Blog</a>
            </div>
            <img class = "mode" src = "img\icon-sun.svg" alt = "light mode">
        </nav>
        <main class = "main-content" id="product-results" aria-live="polite">
        </main>
        <footer>
            <div class="footer">
                <div class="foot">
                    <img src="" alt="">
                    <p>About Me</p>
                </div>
                <div class="foot">
                    <p>Blog</p>
                    <p>Support</p>
                </div>
            </div>
        </footer>
        <noscript>Your browser don't support JavaScript!</noscript>
        <script src = "products.js"></script>
        <script src="./app.js"></script>
    </body>
</html>
